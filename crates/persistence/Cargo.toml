[package]
name = "dev-recall-persistence"
version = "0.1.0"
description = "Bounded local SQLite persistence for Dev Recall"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
sqlx = { version = "0.8.6", default-features = false, features = [
  "migrate",
  "runtime-tokio",
  "sqlite",
] }
futures-core = "0.3.32"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
