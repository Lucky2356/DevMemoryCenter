name: Bug report
description: Report a reproducible Dev Recall defect without sensitive user data.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not paste terminal history, credentials, private paths, logs, or project source. Use synthetic examples.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows 10
        - Windows 11
        - Linux
        - WSL
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.x.y or commit hash
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal steps using synthetic, non-sensitive data.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Explain data loss, privacy, security, accessibility, or workflow impact.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed credentials, personal data, terminal history, private paths, and proprietary source.
          required: true
        - label: This report does not disclose a vulnerability that should be reported privately.
          required: true
