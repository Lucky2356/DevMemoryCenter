[graph]
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
# Transitive lifecycle advisories remain visible without blocking until the
# upstream desktop stack can remove them. Workspace advisories always fail.
unmaintained = "workspace"
unsound = "all"
ignore = [
  { id = "RUSTSEC-2024-0429", reason = "Tauri's Linux WebKit stack requires glib 0.18; Dev Recall does not call the affected VariantStrIter API and tracks the upstream migration in SECURITY_FINDINGS.md" },
]

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "simplest-path"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
